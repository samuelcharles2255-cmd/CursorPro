{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Atrium{% endblock %} · Atrium</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/app.css' %}?v=2.0">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {% include "includes/header.html" %}
  {% include "includes/messages.html" %}
  <main id="main" class="site-main">
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </main>
  <footer class="site-footer">
    <div class="footer-inner">
      <div>
        <div class="brand-mark">Atrium<span>.</span></div>
        <p class="muted">A considered place to find work and people.</p>
      </div>
      <nav>
        <a href="{% url 'web:job_list' %}">Jobs</a> ·
        <a href="{% url 'web:company_list' %}">Companies</a> ·
        <a href="{% url 'web:register' %}">Join</a>
      </nav>
    </div>
  </footer>
  <script src="{% static 'js/app.js' %}?v=2.0"></script>
</body>
</html>
