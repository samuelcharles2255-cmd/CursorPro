{% extends "base.html" %}

{% block title %}Reset password{% endblock %}

{% block content %}
  <div class="auth-wrap panel">
    <h1 class="panel-title">Reset password</h1>
    <p class="muted">Enter your email. If an account exists, a reset link is generated — same contract as the API.</p>
    <form method="post">
      {% csrf_token %}
      {% include "includes/form_fields.html" %}
      <button class="btn" type="submit">Send reset link</button>
    </form>
  </div>
{% endblock %}
