{% load web_tags %}
{% if page.has_other_pages %}
  <nav class="pagination" aria-label="Pagination">
    {% if page.has_previous %}
      <a href="?{% query_replace request page=page.previous_page_number %}">Previous</a>
    {% endif %}
    <span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
    {% if page.has_next %}
      <a href="?{% query_replace request page=page.next_page_number %}">Next</a>
    {% endif %}
  </nav>
{% endif %}
