<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="{% url 'web:home' %}">
      <span class="brand-mark">Atrium<span>.</span></span>
      <span class="brand-tag">Careers</span>
    </a>
    <button class="menu-toggle" type="button" data-menu-toggle aria-expanded="false" aria-label="Open menu">Menu</button>
    <div class="nav-panel">
      <nav class="nav" aria-label="Primary">
        <a href="{% url 'web:home' %}" class="{% if request.resolver_match.url_name == 'home' %}is-active{% endif %}">Home</a>
        <a href="{% url 'web:job_list' %}" class="{% if request.resolver_match.url_name == 'job_list' %}is-active{% endif %}">Jobs</a>
        <a href="{% url 'web:company_list' %}" class="{% if 'company' in request.resolver_match.url_name %}is-active{% endif %}">Companies</a>
        {% if user.is_authenticated %}
          <a href="{% url 'web:profile' %}" class="{% if request.resolver_match.url_name == 'profile' %}is-active{% endif %}">Profile</a>
          {% if user.is_employer %}
            <a href="{% url 'web:employer_profile' %}">Employer</a>
          {% endif %}
        {% endif %}
      </nav>
      <div class="nav-actions">
        {% if user.is_authenticated %}
          <a class="btn-ghost" href="{% url 'web:account' %}">{{ user.name|default:user.email }}</a>
          <form method="post" action="{% url 'web:logout' %}">
            {% csrf_token %}
            <button class="btn-secondary" type="submit">Sign out</button>
          </form>
        {% else %}
          <a class="btn-ghost" href="{% url 'web:login' %}">Sign in</a>
          <a class="btn" href="{% url 'web:register' %}">Create account</a>
        {% endif %}
      </div>
    </div>
  </div>
</header>
