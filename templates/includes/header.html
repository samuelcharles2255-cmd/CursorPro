<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="{% url 'web:home' %}" style="display: inline-flex; align-items: center; gap: 10px; text-decoration: none;">
      <span class="brand-monogram" style="display: inline-flex; width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, rgba(16,185,129,0.25), rgba(15,23,42,0.9), rgba(30,58,138,0.4)); border: 1px solid rgba(16,185,129,0.4); align-items: center; justify-content: center; font-size: 13px; font-weight: 800; color: #ffffff; letter-spacing: 0.5px; box-shadow: 0 4px 14px rgba(16,185,129,0.18);">TC</span>
      <span style="display: flex; flex-direction: column; line-height: 1.1;">
        <span class="brand-mark" style="font-size: 1.4rem; font-weight: 600; color: #fff; letter-spacing: -0.3px;">The City<span style="color: #10b981;">.</span></span>
        <span class="brand-tag" style="font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; font-weight: 600;">Ecosystem</span>
      </span>
    </a>
    <button class="menu-toggle" type="button" data-menu-toggle aria-expanded="false" aria-label="Open menu">Menu</button>
    <div class="nav-panel">
      <nav class="nav" aria-label="Primary">
        <a href="{% url 'web:home' %}" class="{% if request.resolver_match.url_name == 'home' %}is-active{% endif %}">Overview</a>
        <a href="{% url 'web:job_list' %}" class="{% if request.resolver_match.url_name == 'job_list' %}is-active{% endif %}" style="display: inline-flex; align-items: center; gap: 6px;">
          <span>Jobs</span>
          <span style="font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 9999px; background: rgba(37,99,235,0.18); color: #60a5fa; border: 1px solid rgba(59,130,246,0.3);">770+</span>
        </a>
        <a href="{% url 'marketplace:home' %}" class="{% if 'marketplace' in request.path %}is-active{% endif %}" style="display: inline-flex; align-items: center; gap: 6px; color: #10b981; font-weight: 600;">
          <span>Marketplace</span>
          <span style="font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 9999px; background: rgba(16,185,129,0.18); color: #34d399; border: 1px solid rgba(16,185,129,0.3);">Live</span>
        </a>
        <a href="{% url 'web:company_list' %}" class="{% if 'company' in request.resolver_match.url_name %}is-active{% endif %}">Companies</a>
        {% if user.is_authenticated %}
          <a href="{% url 'web:profile' %}" class="{% if request.resolver_match.url_name == 'profile' %}is-active{% endif %}">Profile</a>
          {% if user.is_employer %}
            <a href="{% url 'web:employer_profile' %}">Employer</a>
          {% endif %}
        {% endif %}
      </nav>
      <div class="nav-actions">
        {% if user.is_authenticated %}
          <a class="btn-ghost" href="{% url 'web:account' %}">{{ user.name|default:user.email }}</a>
          <form method="post" action="{% url 'web:logout' %}">
            {% csrf_token %}
            <button class="btn-secondary" type="submit">Sign out</button>
          </form>
        {% else %}
          <a class="btn-ghost" href="{% url 'web:login' %}">Sign in</a>
          <a class="btn" href="{% url 'web:register' %}">Create account</a>
        {% endif %}
      </div>
    </div>
  </div>
</header>
